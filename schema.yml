version: 1 # Версия схемы. Поле обязательное
config:
  lang: "go"       # Язык для которого будет сгенерирован ORM. Может быть php, go, rust. Поле обязательное
  backend: "mysql" # Может быть MySQL, ClickHouse. Поле обязательное
entities:
  - name: "User"  # Название сущности. Поле обязательное
    table: "user" # Название таблицы в бд. Поле обязательное
    fields: # Поля таблицы. Поле обязательное
      - {
        name: "uid",   # Название поля. Поле обязательное
        lang_type: "string",   # Тип поля. Поле обязательное
        required: true, # Допустимые значения true, false. Является ли поле обязательным. Может ли оно быть null. Поле не обязательное
      }
      - {
        name: "login",   # Название поля. Поле обязательное
        lang_type: "string",   # Тип поля. Поле обязательное
        required: true, # Допустимые значения true, false. Является ли поле обязательным. Может ли оно быть null. Поле не обязательное
      }
      - {
        name: "name",   # Название поля. Поле обязательное
        lang_type: "string",   # Тип поля. Поле обязательное
        required: true, # Допустимые значения true, false. Является ли поле обязательным. Может ли оно быть null. Поле не обязательное
      }